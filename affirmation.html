<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affirmation — Oh Dites !</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col">
  <header class="w-full max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-stone-200/80">
    <div class="flex items-center gap-3">
      <img src="images/cerveau-mains-relief.webp" alt="Logo" class="w-8 h-8 object-contain select-none pointer-events-none">
      <a href="index.html" class="text-2xl font-black tracking-tight text-emerald-700">Oh Dites !</a>
    </div>
    <nav class="flex gap-8 text-sm font-semibold text-stone-600">
      <a href="index.html" class="hover:text-emerald-700 transition pb-1">Accueil</a>
      <a href="audits.html" class="hover:text-emerald-700 transition pb-1">Les Audits (GÉT)</a>
      <a href="affirmations.html" class="hover:text-emerald-700 transition pb-1">Affirmations</a>
      <a href="dossier.html" class="hover:text-emerald-700 transition pb-1">Dossiers</a>
      <a href="charte.html" class="hover:text-emerald-700 transition pb-1">Charte & Valeurs</a>
      <a href="fun.html" class="hover:text-emerald-700 transition pb-1">Espace F.U.N.</a>
    </nav>
  </header>

  <main class="w-full max-w-4xl mx-auto px-6 py-10 flex-grow">
    <a href="affirmations.html" class="text-sm text-emerald-700 hover:underline">&larr; Retour aux affirmations</a>
    <div id="aff-head" class="mt-4 bg-white rounded-2xl border border-stone-200/60 p-6 shadow-sm">
      <p class="text-stone-400 text-sm">Chargement de l'affirmation…</p>
    </div>

    <!-- BOÎTE DE POST UNIQUE : confirmer / contester / parler / ajouter une ressource -->
    <div class="mt-6 bg-white rounded-2xl border border-stone-200/60 p-5">
      <div class="flex flex-wrap gap-2 mb-3" id="barre-actions">
        <button data-act="confirm" class="post-act px-4 py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white transition cursor-pointer">✓ Confirmer</button>
        <button data-act="contest" class="post-act px-4 py-2 rounded-xl text-sm font-bold text-red-700 border border-red-300 hover:bg-red-50 transition cursor-pointer">✗ Contester</button>
        <button data-act="parler" class="post-act px-4 py-2 rounded-xl text-sm font-bold text-stone-700 border border-stone-300 hover:bg-stone-100 transition cursor-pointer">💬 Parler</button>
        <button data-act="ressource" class="post-act px-4 py-2 rounded-xl text-sm font-bold text-stone-700 border border-stone-300 hover:bg-stone-100 transition cursor-pointer">🔗 Ajouter une ressource</button>
      </div>
      <textarea id="post-texte" rows="2" class="w-full bg-stone-50 text-sm px-4 py-3 rounded-xl border border-stone-200 placeholder-stone-400" placeholder="Votre message ou le motif de votre action…"></textarea>
      <div id="post-ressource" class="hidden flex flex-col sm:flex-row gap-2 mt-2">
        <input id="res-titre" type="text" placeholder="Titre du document" class="flex-1 bg-stone-50 text-sm px-4 py-2.5 rounded-xl border border-stone-200">
        <input id="res-url" type="url" placeholder="URL de la ressource" class="flex-1 bg-stone-50 text-sm px-4 py-2.5 rounded-xl border border-stone-200">
      </div>
      <div class="mt-3 flex justify-end">
        <button id="btn-poster" class="bg-stone-900 hover:bg-stone-800 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition cursor-pointer">Poster</button>
      </div>
    </div>

    <!-- FIL DES ÉCHANGES : tout descend ici -->
    <div class="mt-6">
      <h3 class="font-bold text-stone-900 mb-3">💬 Fil des échanges</h3>
      <div id="fil" class="flex flex-col gap-3"><p class="text-stone-400 text-sm">Chargement…</p></div>
    </div>
  </main>

  <footer class="w-full max-w-7xl mx-auto px-6 py-4 border-t border-stone-200/80 text-center text-xs text-stone-500">
    © 2026 Oh Dites ! — Espace de compréhension, pas de combat.
  </footer>

  <script>
    const API = 'https://trchckgeemvqlgbcrntz.supabase.co';
    const KEY = 'sb_publishable_fAefpcpQfoolCPlQwBzxlg_0M9-jfRV';
    const params = new URLSearchParams(window.location.search);
    const affId = params.get('id');

    const STATUT = { 'proposee':'proposée','a_verifier':'à vérifier','confirmee':'confirmée','contestee':'contestée','nuanacee':'nuancée','refutee':'réfutée','impossible':'impossible à vérifier' };
    const COUL = { 'proposee':'bg-stone-200 text-stone-700','a_verifier':'bg-yellow-100 text-yellow-800','confirmee':'bg-emerald-100 text-emerald-800','contestee':'bg-orange-100 text-orange-800','nuanacee':'bg-blue-100 text-blue-800','refutee':'bg-red-100 text-red-800','impossible':'bg-stone-100 text-stone-500' };
    function esc(t){ const d=document.createElement('div'); d.textContent=(t==null?'':String(t)); return d.innerHTML; }
    async function api(method, path, body){
      const r=await fetch(API+path,{method,headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=representation'},body:body?JSON.stringify(body):undefined});
      if(!r.ok){ let m='HTTP '+r.status; try{const j=await r.json();m=j.message||m;}catch(e){} throw new Error(m); }
      try{return await r.json();}catch(e){return null;}
    }

    // ---------- état global de l'action sélectionnée ----------
    let actionCourante = 'confirm';
    let modifActive = false;

    // ---------- en-tête de l'affirmation ----------
    async function charger(){
      if(!affId){ document.getElementById('aff-head').innerHTML='<p class="text-red-600 text-sm">Aucune affirmation sélectionnée.</p>'; return; }
      try{
        const a = await api('GET','/rest/v1/affirmations?select=*,sujets(nom)&id=eq.'+encodeURIComponent(affId));
        const aff = a && a[0];
        if(!aff){ document.getElementById('aff-head').innerHTML='<p class="text-red-600 text-sm">Affirmation introuvable.</p>'; return; }
        const Moi = localStorage.getItem('ohd_moi') || 'Citoyen lambda';
        document.getElementById('aff-head').innerHTML=`
          <div class="flex items-start justify-between gap-3">
            <p class="text-lg font-medium text-stone-900">${esc(aff.texte)}</p>
            <span class="shrink-0 text-xs px-3 py-1 rounded-full ${COUL[aff.statut]||'bg-stone-200'}">${STATUT[aff.statut]||aff.statut}</span>
          </div>
          <div class="mt-3 text-xs text-stone-500 flex flex-wrap gap-3">
            ${aff.sujets&&aff.sujets.nom?'<span class="text-stone-400">🏷 '+esc(aff.sujets.nom)+'</span>':''}
            ${aff.auteur_ajout?'<span>par '+esc(aff.auteur_ajout)+'</span>':''}
            ${aff.confirmations>0?'<span class="text-emerald-700">✓ '+aff.confirmations+' confirmations</span>':''}
            ${aff.contestations>0?'<span class="text-red-700">✗ '+aff.contestations+' contestations</span>':''}
          </div>
          ${aff.auteur_ajout === Moi ? `
            <div class="mt-3 flex gap-2">
              <span class="text-xs font-semibold text-stone-500 self-center">C'est votre affirmation :</span>
              <button id="btn-modif" class="text-xs text-stone-600 border border-stone-300 px-3 py-1.5 rounded-xl hover:bg-stone-100 transition cursor-pointer">✏️ Modifier</button>
              <button id="btn-suppr" class="text-xs text-red-700 border border-red-200 px-3 py-1.5 rounded-xl hover:bg-red-50 transition cursor-pointer">🗑 Supprimer</button>
            </div>` : ''}`;
        // gestion si je suis l'auteur
        const btnS=document.getElementById('btn-suppr');
        if(btnS) btnS.addEventListener('click', async ()=>{ if(confirm('Supprimer cette affirmation ?')){ await api('DELETE','/rest/v1/affirmations?id=eq.'+encodeURIComponent(affId)); window.location.href='affirmations.html'; } });
        const btnM=document.getElementById('btn-modif');
        if(btnM){ btnM.addEventListener('click', ()=>{ modifActive=true; document.getElementById('post-texte').value=aff.texte; document.getElementById('post-texte').focus(); document.getElementById('post-msg2') && (document.getElementById('post-msg2').textContent='Modif de votre affirmation en cours — cliquez Poster.'); }); }
        chargerFil();
      }catch(e){ document.getElementById('aff-head').innerHTML='<p class="text-red-600 text-sm">Erreur : '+esc(e.message)+'</p>'; }
    }

    // ---------- fil des échanges ----------
    async function chargerFil(){
      const zone=document.getElementById('fil');
      try{
        const fil = await api('GET','/rest/v1/echanges?affirmation_id=eq.'+encodeURIComponent(affId)+'&order=cree_le.asc');
        // + les ressources liées (on les montre comme des événements docs)
        const liens = await api('GET','/rest/v1/affirmation_documents?select=document_id&affirmation_id=eq.'+encodeURIComponent(affId));
        if((!fil || !fil.length) && (!liens||!liens.length)){ zone.innerHTML='<p class="text-stone-500 text-sm">Aucun échange pour l\'instant. Soyez le premier à réagir ci-dessus.</p>'; return; }
        let html='';
        // ressources liées d'abord (contexte documentaire)
        if(liens && liens.length){
          const ids=liens.map(l=>l.document_id).join(',');
          const docs=await api('GET','/rest/v1/documents?select=titre,url,type_document&id=in.('+ids+')');
          if(docs&&docs.length){
            html += `<div class="rounded-xl border-l-2 border-emerald-400 pl-3 py-1">
              <div class="text-xs"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full">🔗 ressources liées</span></div>
              <ul class="mt-1">${docs.map(d=>`<li class="text-sm"><a href="${esc(d.url)}" target="_blank" rel="noopener" class="text-emerald-700 hover:underline">📄 ${esc(d.titre)}</a> <span class="text-stone-400">(${esc(d.type_document||'ressource')})</span></li>`).join('')}</ul>
            </div>`;
          }
        }
        // événements du fil
        if(fil && fil.length){
          html += fil.map(e=>{
            let badge='', couleur='';
            if(e.type==='confirm'){ badge='✓ confirmation'; couleur='text-emerald-700 bg-emerald-50'; }
            else if(e.type==='contest'){ badge='✗ contestation'; couleur='text-red-700 bg-red-50'; }
            else { badge='💬 remarque'; couleur='text-stone-600 bg-stone-100'; }
            const contenant = e.contenu || (e.type==='confirm' ? 'a confirmé cette affirmation' : '');
            const estMoi = (e.auteur||'') === 'Citoyen lambda';
            return `<div class="rounded-xl border-l-2 border-stone-200 pl-3 py-1">
              <div class="flex items-center gap-2 text-xs"><span class="${couleur} px-2 py-0.5 rounded-full">${badge}</span><span class="text-stone-400">${esc(e.auteur||'Citoyen')}</span>
              ${estMoi?`<button data-id="${e.id}" data-type="${e.type}" class="retirer-btn ml-auto text-[10px] text-stone-400 hover:text-red-600">Retirer</button>`:''}
              </div>
              ${contenant ? `<p class="text-sm text-stone-700 mt-1">${esc(contenant)}</p>` : ''}
            </div>`;
          }).join('');
        }
        zone.innerHTML=html;
        // attacher les boutons 'Retirer' (robuste, plus fiable que onclick inline)
        zone.querySelectorAll('.retirer-btn').forEach(btn=>{
          btn.addEventListener('click', ()=> retirerEchange(btn.dataset.id, btn.dataset.type));
        });
      }catch(e){ zone.innerHTML='<p class="text-red-600 text-sm">Erreur fil : '+esc(e.message)+'</p>'; }
    }

    // ---------- boîte de post : sélecteur d'action ----------
    document.querySelectorAll('.post-act').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        actionCourante = btn.dataset.act;
        // styler le bouton actif
        document.querySelectorAll('.post-act').forEach(b=>{
          b.classList.remove('bg-emerald-600','text-white','actif');
          // reset styles par défaut pour non-ressource
        });
        // réappliquer style selon l'action
        const styles = {
          confirm: ['bg-emerald-600','text-white','border-emerald-600'],
          contest: ['text-red-700','border-red-300'],
          parler: ['text-stone-700','border-stone-300'],
          ressource: ['text-stone-700','border-stone-300']
        };
        btn.classList.add(...(styles[actionCourante]||[]));
        // montrer/cacher les champs ressource
        const zoneRes=document.getElementById('post-ressource');
        const ta=document.getElementById('post-texte');
        if(actionCourante==='ressource'){
          zoneRes.classList.remove('hidden');
          zoneRes.classList.add('flex');
          ta.classList.add('hidden');
        } else {
          zoneRes.classList.add('hidden');
          zoneRes.classList.remove('flex');
          ta.classList.remove('hidden');
          ta.placeholder = actionCourante==='contest' ? 'Justifiez votre contestation (source, erreur, chiffre…)…'
                               : actionCourante==='parler' ? 'Votre remarque argumentée…' : 'Message (optionnel pour confirmer)…';
        }
      });
    });

    // ---------- bouton Poster ----------
    document.getElementById('btn-poster').addEventListener('click', async ()=>{
      const ta=document.getElementById('post-texte');
      const texte=ta.value.trim();
      try{
        // MODE MODIFICATION : mettre à jour ma propre affirmation
        if(modifActive){
          if(!texte){ alert('Veuillez écrire le nouveau texte.'); return; }
          await api('PATCH','/rest/v1/affirmations?id=eq.'+encodeURIComponent(affId),{texte});
          modifActive=false;
          ta.value='';
          charger();
          return;
        }
        const msg=actionCourante;
        if(actionCourante==='confirm'){
          await realiserVote(affId,'confirm',null);
          ta.value='';
        }
        else if(actionCourante==='contest'){
          if(!texte){ alert('Veuillez justifier votre contestation.'); return; }
          await realiserVote(affId,'contest',texte);
          ta.value='';
        }
        else if(actionCourante==='parler'){
          if(!texte){ alert('Veuillez écrire une remarque.'); return; }
          await api('POST','/rest/v1/echanges',{affirmation_id:affId,type:'commentaire',auteur:'Citoyen lambda',contenu:texte});
          ta.value='';
        }
        else if(actionCourante==='ressource'){
          const titre=document.getElementById('res-titre').value.trim();
          const url=document.getElementById('res-url').value.trim();
          if(!titre){ alert('Titre de la ressource requis.'); return; }
          const doc=await api('POST','/rest/v1/documents',{titre,url:url||null,type_document:'ressource'});
          if(doc&&doc[0]) await api('POST','/rest/v1/affirmation_documents',{affirmation_id:affId,document_id:doc[0].id});
          document.getElementById('res-titre').value='';
          document.getElementById('res-url').value='';
        }
        charger();
        chargerFil();
      }catch(e){ alert('Erreur : '+e.message); }
    });

    // ---------- vote/undo ----------
    function calculStatut(conf, cont){
      if(cont>0) return 'contestee';
      if(conf>=2) return 'confirmee';
      if(conf>=1) return 'a_verifier';  // 1 confirmation = premier accord (encore à vérifier)
      return 'proposee';
    }
    async function realiserVote(id, type, motifTexte){
      const cle='ohd_vote_'+id+'_'+type;
      const deja=!!localStorage.getItem(cle);
      if(deja){
        // déjà voté : on N'ANNULE PAS silencieusement, on signale pour un retrait explicite
        alert("Vous avez déjà "+(type==='confirm'?'confirmé':'contesté')+" cette affirmation. Retirez-la depuis le fil des échanges (bouton 'Retirer').");
        return;
      }
      const cur=await api('GET','/rest/v1/affirmations?select=confirmations,contestations,statut&id=eq.'+encodeURIComponent(id));
      const base=(cur&&cur[0])||{confirmations:0,contestations:0,statut:'proposee'};
      let conf=base.confirmations||0, cont=base.contestations||0;
      if(type==='confirm') conf += 1; else cont += 1;
      const upd={confirmations:conf,contestations:cont,statut:calculStatut(conf,cont)};
      if(type==='contest' && motifTexte) upd.commentaire=motifTexte;
      await api('PATCH','/rest/v1/affirmations?id=eq.'+encodeURIComponent(id), upd);
      await api('POST','/rest/v1/echanges',{affirmation_id:id,type:type,auteur:'Citoyen lambda',contenu: type==='contest' ? motifTexte : null});
      localStorage.setItem(cle,'1');
    }

    // Retirer un de mes échanges (vote/remarque) et corriger le compteur
    async function retirerEchange(echId, type){
      try{
        await api('DELETE','/rest/v1/echanges?id=eq.'+encodeURIComponent(echId));
        // recalculer le compteur depuis le fil restant
        const fil=await api('GET','/rest/v1/echanges?affirmation_id=eq.'+encodeURIComponent(affId));
        const confirms=(fil||[]).filter(e=>e.type==='confirm').length;
        const contests=(fil||[]).filter(e=>e.type==='contest').length;
        const upd={confirmations:confirms,contestations:contests,statut:calculStatut(confirms,contests)};
        await api('PATCH','/rest/v1/affirmations?id=eq.'+encodeURIComponent(affId),upd);
        // nettoyer localStorage du vote retiré
        localStorage.removeItem('ohd_vote_'+affId+'_'+type);
        charger();
        chargerFil();
      }catch(e){ alert('Erreur : '+e.message); }
    }

    charger();
    chargerFil();
  </script>
</body>
</html>
