<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affirmation — Oh Dites !</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col">
  <header class="w-full max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-stone-200/80">
    <div class="flex items-center gap-3">
      <img src="images/cerveau-mains-relief.webp" alt="Logo" class="w-8 h-8 object-contain select-none pointer-events-none">
      <a href="index.html" class="text-2xl font-black tracking-tight text-emerald-700">Oh Dites !</a>
    </div>
    <nav class="flex gap-8 text-sm font-semibold text-stone-600">
      <a href="index.html" class="hover:text-emerald-700 transition pb-1">Accueil</a>
      <a href="audits.html" class="hover:text-emerald-700 transition pb-1">Les Audits (GÉT)</a>
      <a href="affirmations.html" class="hover:text-emerald-700 transition pb-1">Affirmations</a>
      <a href="dossier.html" class="hover:text-emerald-700 transition pb-1">Dossiers</a>
      <a href="charte.html" class="hover:text-emerald-700 transition pb-1">Charte & Valeurs</a>
      <a href="fun.html" class="hover:text-emerald-700 transition pb-1">Espace F.U.N.</a>
    </nav>
  </header>

  <main class="w-full max-w-4xl mx-auto px-6 py-10 flex-grow">
    <a href="affirmations.html" class="text-sm text-emerald-700 hover:underline">&larr; Retour aux affirmations</a>
    <!-- En-tête de l'affirmation -->
    <div id="aff-head" class="mt-4 bg-white rounded-2xl border border-stone-200/60 p-6 shadow-sm">
      <p class="text-stone-400 text-sm">Chargement de l'affirmation…</p>
    </div>

    <!-- Barre d'action : ajouter une carte (confirmer / contester) -->
    <div class="mt-6 bg-white rounded-2xl border border-stone-200/60 p-5">
      <div class="flex gap-2 mb-3">
        <button id="btn-confirmer" class="px-4 py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white transition cursor-pointer">✓ Confirmer</button>
        <button id="btn-contester" class="px-4 py-2 rounded-xl text-sm font-bold text-red-700 border border-red-300 hover:bg-red-50 transition cursor-pointer">✗ Contester</button>
        <button id="btn-commenter" class="px-4 py-2 rounded-xl text-sm font-bold text-stone-700 border border-stone-300 hover:bg-stone-100 transition cursor-pointer">💬 Commenter l'affirmation</button>
      </div>
      <div id="editeur-carte" class="hidden flex-col gap-2">
        <textarea id="carte-arg" rows="2" class="w-full bg-stone-50 text-sm px-4 py-3 rounded-xl border border-stone-200 placeholder-stone-400" placeholder="Votre argument (raison, source…)"></textarea>
        <input id="carte-source" type="url" placeholder="Source (URL) — optionnel" class="w-full bg-stone-50 text-sm px-4 py-2.5 rounded-xl border border-stone-200 placeholder-stone-400">
        <div class="flex justify-end">
          <button id="btn-poster-carte" class="bg-stone-900 hover:bg-stone-800 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition cursor-pointer">Poster</button>
        </div>
      </div>
      <div id="editeur-comment-general" class="hidden flex-col gap-2">
        <textarea id="comment-gen-texte" rows="2" class="w-full bg-stone-50 text-sm px-4 py-3 rounded-xl border border-stone-200 placeholder-stone-400" placeholder="Votre commentaire sur l'affirmation…"></textarea>
        <div class="flex justify-end">
          <button id="btn-poster-comment-gen" class="bg-stone-800 hover:bg-stone-900 text-white text-sm font-bold px-5 py-2.5 rounded-xl transition cursor-pointer">Poster</button>
        </div>
      </div>
    </div>

    <!-- Zone des cartes (confirmations / contestations) + commentaires imbriqués -->
    <div class="mt-8">
      <h3 class="font-bold text-stone-900 mb-3">💬 Discussions & avis</h3>
      <div id="fil" class="flex flex-col gap-5"><p class="text-stone-400 text-sm">Chargement…</p></div>
    </div>
  </main>

  <!-- MODAL DE CONFIRMATION (remplace les popups navigateur) -->
  <div id="modal-confirm" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
      <h3 id="confirm-titre" class="text-lg font-bold text-red-700 mb-2">⚠️ Confirmer</h3>
      <p id="confirm-texte" class="text-sm text-stone-600 mb-5"></p>
      <div class="flex justify-end gap-3">
        <button id="confirm-non" class="px-5 py-2.5 rounded-xl border border-stone-300 text-sm text-stone-600 hover:bg-stone-100 transition cursor-pointer">Annuler</button>
        <button id="confirm-oui" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-bold transition cursor-pointer">Confirmer</button>
      </div>
    </div>
  </div>

  <footer class="w-full max-w-7xl mx-auto px-6 py-4 border-t border-stone-200/80 text-center text-xs text-stone-500">
    © 2026 Oh Dites ! — Espace de compréhension, pas de combat.
  </footer>

  <script>
    const API = 'https://trchckgeemvqlgbcrntz.supabase.co';
    const KEY = 'sb_publishable_fAefpcpQfoolCPlQwBzxlg_0M9-jfRV';
    const params = new URLSearchParams(window.location.search);
    const affId = params.get('id');

    const STATUT = { 'proposee':'proposée','a_verifier':'à vérifier','confirmee':'confirmée','contestee':'contestée','nuanacee':'nuancée','refutee':'réfutée','impossible':'impossible à vérifier' };
    const COUL = { 'proposee':'bg-stone-200 text-stone-700','a_verifier':'bg-yellow-100 text-yellow-800','confirmee':'bg-emerald-100 text-emerald-800','contestee':'bg-orange-100 text-orange-800','nuanacee':'bg-blue-100 text-blue-800','refutee':'bg-red-100 text-red-800','impossible':'bg-stone-100 text-stone-500' };
    function esc(t){ const d=document.createElement('div'); d.textContent=(t==null?'':String(t)); return d.innerHTML; }
    async function api(method, path, body){
      const r=await fetch(API+path,{method,cache:'no-store',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':'return=representation','Cache-Control':'no-cache'},body:body?JSON.stringify(body):undefined});
      if(!r.ok){ let m='HTTP '+r.status; try{const j=await r.json();m=j.message||m;}catch(e){} throw new Error(m); }
      try{return await r.json();}catch(e){return null;}
    }

    // Confirmation par modal intégré (remplace les popups navigateur)

    let confirmCallback=null;

    function confirmer(titre, texte, callback){

      document.getElementById('confirm-titre').textContent=titre;

      document.getElementById('confirm-texte').textContent=texte;

      confirmCallback=callback;

      const m=document.getElementById('modal-confirm');

      m.classList.remove('hidden'); m.classList.add('flex');

    }

    function fermerConfirm(){ const m=document.getElementById('modal-confirm'); m.classList.add('hidden'); m.classList.remove('flex'); confirmCallback=null; }

    document.getElementById('confirm-non').addEventListener('click', fermerConfirm);

    document.getElementById('confirm-oui').addEventListener('click', ()=>{ const cb=confirmCallback; fermerConfirm(); if(cb) cb(); });


    // ---------- en-tête ----------
    async function chargerEntete(){
      const head=document.getElementById('aff-head');
      try{
        const a=await api('GET','/rest/v1/affirmations?select=*,sujets(nom),documents!affirmations_document_id_fkey(id,titre,url)&id=eq.'+encodeURIComponent(affId));
        const aff=a&&a[0];
        if(!aff){ head.innerHTML='<p class="text-red-600 text-sm">Affirmation introuvable.</p>'; return; }
        head.innerHTML=`
          <div class="flex items-start justify-between gap-3">
            <p class="text-lg font-medium text-stone-900">${esc(aff.texte)}</p>
            <span class="shrink-0 text-xs px-3 py-1 rounded-full ${COUL[aff.statut]||'bg-stone-200'}">${STATUT[aff.statut]||aff.statut}</span>
          </div>
          <div class="mt-3 text-xs text-stone-500 flex flex-wrap gap-3">
            ${aff.sujets&&aff.sujets.nom?'<span class="text-stone-400">🏷 '+esc(aff.sujets.nom)+'</span>':''}
            ${aff.auteur_ajout?'<span class="text-stone-400">par '+esc(aff.auteur_ajout)+'</span>':''}
            ${aff.confirmations>0?'<span class="text-emerald-700">✓ '+aff.confirmations+'</span>':''}
            ${aff.contestations>0?'<span class="text-red-700">✗ '+aff.contestations+'</span>':''}
          </div>
          ${(function(){
            const d=aff.documents?(Array.isArray(aff.documents)?aff.documents[0]:aff.documents):null;
            if(!d||!d.id) return '';
            return `<div class="mt-3 text-xs"><span class="text-stone-500">Source : </span><a href="document.html?id=${esc(d.id)}" class="text-emerald-700 font-semibold hover:underline">📄 ${esc(d.titre||'voir le document')}</a>${d.url?' <a href="'+esc(d.url)+'" target="_blank" rel="noopener" class="text-stone-400 hover:text-emerald-700" title="Ouvrir la source">↗</a>':''}</div>`;
          })()}
          <div class="mt-3 flex justify-end">
            <button id="btn-suppr-aff" class="text-xs text-red-600 border border-red-200 px-3 py-1.5 rounded-xl hover:bg-red-50 transition cursor-pointer">🗑 Supprimer cette affirmation</button>
          </div>`;
        // suppression de l'affirmation (god mode) + tout son contenu en cascade
        const bs=document.getElementById('btn-suppr-aff');
        if(bs) bs.addEventListener('click', ()=>{
          confirmer('Supprimer cette affirmation', 'Tout le contenu lié (cartes, commentaires, réactions) sera définitivement supprimé. Cette action est irréversible.', async ()=>{
            try{ await api('DELETE','/rest/v1/affirmations?id=eq.'+encodeURIComponent(affId)); window.location.href='affirmations.html'; }
            catch(e){ alert('Erreur : '+e.message); }
          });
        });
      }catch(e){ head.innerHTML='<p class="text-red-600 text-sm">Erreur : '+esc(e.message)+'</p>'; }
    }

    // ---------- récupérer toutes les discussions (cartes + commentaires) ----------
    async function chargerFil(){
      const zone=document.getElementById('fil');
      try{
        const tudo=await api('GET','/rest/v1/echanges?affirmation_id=eq.'+encodeURIComponent(affId)+'&order=cree_le.asc');
        if(!tudo||!tudo.length){ zone.innerHTML='<p class="text-stone-500 text-sm">Aucun avis pour l\'instant. Confirmez, contestez ou commentez ci-dessus.</p>'; return; }
        // charger les réactions de tous les échanges de cette affirmation (une requête)
        const ids=(tudo||[]).map(e=>e.id).join(',');
        const reactions = await api('GET','/rest/v1/reactions?echange_id=in.('+ids+')');
        const reactPar = {};
        (reactions||[]).forEach(r=>{ (reactPar[r.echange_id]=reactPar[r.echange_id]||{like:0,dislike:0})[r.type_reaction]++; });
        const cartes=tudo.filter(e=>!e.parent_id);
        const comas=tudo.filter(e=>e.parent_id);
        let html='';
        for(const c of cartes){
          // sources de la carte
          let sourcesHtml='';
          try{
            const liens=await api('GET','/rest/v1/echange_documents?select=document_id&echange_id=eq.'+encodeURIComponent(c.id));
            if(liens&&liens.length){
              const ids=liens.map(l=>l.document_id).join(',');
              const docs=await api('GET','/rest/v1/documents?select=titre,url&id=in.('+ids+')');
              if(docs&&docs.length) sourcesHtml='<div class="mt-2 text-xs"><span class="text-stone-400">🔗 sources : </span>'+docs.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener" class="text-emerald-700 hover:underline">${esc(d.titre)}</a>`).join(', ')+'</div>';
            }
          }catch(_){}
          // commentaires de cette carte (rattachés directement ou en réponse)
          const mineurs=comas.filter(x=>x.parent_id===c.id);
          const mineursHtml = mineurs.map(m=>renderCommentaire(m)).join('');
          // statut visuel de la carte
          const estContest = c.type==='contest';
          html += `
            <div class="bg-white rounded-2xl border ${estContest?'border-red-200':'border-emerald-200'} shadow-sm" data-carte="${c.id}">
              <div class="p-4">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 text-sm">
                    <span class="px-2 py-0.5 rounded-full ${estContest?'bg-red-100 text-red-800':'bg-emerald-100 text-emerald-800'} text-xs font-bold">${estContest?'✗ Contesté':'✓ Confirmé'}</span>
                    <span class="text-stone-500 text-xs">${esc(c.auteur||'Citoyen')}</span>
                  </div>
                  <button data-carte-id="${c.id}" class="retirer-carte text-xs text-stone-400 hover:text-red-600 transition cursor-pointer">🗑 Retirer cette carte</button>
                </div>
                ${c.contenu?'<p class="text-sm text-stone-700 mt-2">'+esc(c.contenu)+'</p>':''}
                ${sourcesHtml}
                <!-- réactions de la carte -->
                <div class="mt-2 flex items-center gap-3 text-sm">
                  <button data-ech="${c.id}" data-type="like" class="react-btn flex items-center gap-1 text-stone-500 hover:text-emerald-600 transition cursor-pointer">👍 <span class="react-count" data-ech="${c.id}" data-t="like">${(reactPar[c.id]&&reactPar[c.id].like)||0}</span></button>
                  <button data-ech="${c.id}" data-type="dislike" class="react-btn flex items-center gap-1 text-stone-500 hover:text-red-600 transition cursor-pointer">👎 <span class="react-count" data-ech="${c.id}" data-t="dislike">${(reactPar[c.id]&&reactPar[c.id].dislike)||0}</span></button>
                </div>
                <!-- commentaires de la carte -->
                <div class="mt-3 border-t border-stone-100 pt-2">
                  ${mineursHtml || '<p class="text-xs text-stone-400">Aucun commentaire.</p>'}
                </div>
                <!-- zone commentaire pour cette carte -->
                <div class="mt-2 flex flex-col sm:flex-row gap-2">
                  <input data-parent="${c.id}" class="nvo-comment flex-1 bg-stone-50 text-xs px-3 py-2 rounded-xl border border-stone-200 placeholder-stone-400" placeholder="Commenter cette carte…">
                  <button data-parent="${c.id}" class="btn-commenter-carte text-xs bg-stone-200 text-stone-700 px-3 py-2 rounded-xl hover:bg-stone-300 transition cursor-pointer">Commenter</button>
                </div>
              </div>
            </div>`;
        }
        zone.innerHTML=html;
        // attacher les événements
        zone.querySelectorAll('.retirer-carte').forEach(b=>b.addEventListener('click',()=>retirerCarte(b.dataset.carteId)));
        zone.querySelectorAll('.btn-commenter-carte').forEach(b=>b.addEventListener('click',()=>posterCommentaire(b.dataset.parent)));
        zone.querySelectorAll('.retirer-comment').forEach(b=>b.addEventListener('click',()=>retirerCommentaire(b.dataset.commentId)));
        zone.querySelectorAll('.react-btn').forEach(b=>b.addEventListener('click',()=>react(b.dataset.ech, b.dataset.type)));
      }catch(e){ zone.innerHTML='<p class="text-red-600 text-sm">Erreur : '+esc(e.message)+'</p>'; }
    }

    // like/dislike (god mode : on ajoute/retire à chaque clic)
    async function react(echId, type){
      try{
        // god mode : chaque clic ajoute une réaction de ce type
        await api('POST','/rest/v1/reactions',{echange_id:echId,type_reaction:type,auteur:'Citoyen lambda'});
        chargerFil();
      }catch(e){ alert('Erreur réaction : '+e.message); }
    }

    function renderCommentaire(m){
      const likes=(reactPar[m.id]&&reactPar[m.id].like)||0;
      const dislikes=(reactPar[m.id]&&reactPar[m.id].dislike)||0;
      return `<div class="flex items-start justify-between gap-2 py-1">
        <div class="flex-1"><span class="text-xs text-stone-400">${esc(m.auteur||'Citoyen')}</span><div class="text-sm text-stone-700">${esc(m.contenu||'')}
          <div class="flex items-center gap-3 mt-1 text-xs">
            <button data-ech="${m.id}" data-type="like" class="react-btn flex items-center gap-1 text-stone-400 hover:text-emerald-600 transition cursor-pointer">👍 <span class="react-count" data-ech="${m.id}" data-t="like">${likes}</span></button>
            <button data-ech="${m.id}" data-type="dislike" class="react-btn flex items-center gap-1 text-stone-400 hover:text-red-600 transition cursor-pointer">👎 <span class="react-count" data-ech="${m.id}" data-t="dislike">${dislikes}</span></button>
          </div>
        </div></div>
        <button data-comment-id="${m.id}" class="retirer-comment text-[10px] text-stone-400 hover:text-red-600 transition cursor-pointer">🗑 retirer</button>
      </div>`;
    }

    // ---------- retirer une carte (supprime la carte + ses commentaires enfants) ----------
    async function retirerCarte(carteId){
      confirmer('Retirer cette carte', 'La carte et tous ses commentaires seront supprimés. Cette action est irréversible.', async ()=>{
        try{
          await api('DELETE','/rest/v1/echanges?id=eq.'+encodeURIComponent(carteId));
          await recalculerCompteurs();
          chargerFil();
        }catch(e){ alert('Erreur : '+e.message); }
      });
    }
    async function retirerCommentaire(commentId){
      try{ await api('DELETE','/rest/v1/echanges?id=eq.'+encodeURIComponent(commentId)); chargerFil(); }
      catch(e){ alert('Erreur : '+e.message); }
    }

    // ---------- poster un commentaire sur une carte ----------
    async function posterCommentaire(parentId){
      const input=document.querySelector('[data-parent="'+parentId+'"].nvo-comment');
      const texte=input?input.value.trim():'';
      if(!texte){ alert('Écrivez un commentaire.'); return; }
      await api('POST','/rest/v1/echanges',{affirmation_id:affId,parent_id:parentId,type:'commentaire',auteur:'Citoyen lambda',contenu:texte});
      chargerFil();
    }

    // ---------- recalculer les compteurs de l'affirmation depuis les cartes ----------
    async function recalculerCompteurs(){
      try{
        // récupérer tous les échanges puis filtrer les cartes en JS (fiable)
        const tudo=await api('GET','/rest/v1/echanges?affirmation_id=eq.'+encodeURIComponent(affId));
        const cartes=(tudo||[]).filter(e=>!e.parent_id && (e.type==='confirm'||e.type==='contest'));
        const confirms=cartes.filter(e=>e.type==='confirm').length;
        const contests=cartes.filter(e=>e.type==='contest').length;
        // calculer le statut
        let statut='proposee';
        if(contests>0) statut='contestee';
        else if(confirms>=2) statut='confirmee';
        else if(confirms>=1) statut='a_verifier';
        await api('PATCH','/rest/v1/affirmations?id=eq.'+encodeURIComponent(affId),{confirmations:confirms,contestations:contests,statut,commentaire:null});
        chargerEntete();
      }catch(e){}
    }

    // ---------- actions : confirmer / contester / commenter ----------
    let typeCarte='confirm';
    document.getElementById('btn-confirmer').addEventListener('click',()=>{ typeCarte='confirm'; ouvrirEditeur(); });
    document.getElementById('btn-contester').addEventListener('click',()=>{ typeCarte='contest'; ouvrirEditeur(); });
    function ouvrirEditeur(){
      document.getElementById('editeur-carte').classList.remove('hidden');
      document.getElementById('editeur-carte').classList.add('flex');
      document.getElementById('comment-gen-texte')&&document.getElementById('editeur-comment-general')?.classList.add('hidden');
    }
    document.getElementById('btn-commenter').addEventListener('click',()=>{
      document.getElementById('editeur-comment-general').classList.remove('hidden');
      document.getElementById('editeur-comment-general').classList.add('flex');
      document.getElementById('editeur-carte').classList.add('hidden');
    });

    async function posterCarte(){
      const arg=document.getElementById('carte-arg').value.trim();
      const src=document.getElementById('carte-source').value.trim();
      if(!arg && typeCarte==='contest'){ alert('Justifiez votre contestation (argument).'); return; }
      // créer la carte (échange type confirmer/contester)
      const carte=await api('POST','/rest/v1/echanges',{affirmation_id:affId,parent_id:null,type:typeCarte,auteur:'Citoyen lambda',contenu:arg||null});
      // source éventuelle
      if(carte&&carte[0]&&src){
        const doc=await api('POST','/rest/v1/documents',{titre:(arg?arg.slice(0,40):'source')+'…',url:src,type_document:'source'});
        if(doc&&doc[0]) await api('POST','/rest/v1/echange_documents',{echange_id:carte[0].id,document_id:doc[0].id});
      }
      document.getElementById('carte-arg').value='';
      document.getElementById('carte-source').value='';
      document.getElementById('editeur-carte').classList.add('hidden');
      await recalculerCompteurs();
      chargerFil();
    }
    document.getElementById('btn-poster-carte').addEventListener('click',posterCarte);
    document.getElementById('btn-poster-comment-gen').addEventListener('click',async()=>{
      const t=document.getElementById('comment-gen-texte').value.trim();
      if(!t){ alert('Écrivez un commentaire.'); return; }
      await api('POST','/rest/v1/echanges',{affirmation_id:affId,parent_id:null,type:'commentaire',auteur:'Citoyen lambda',contenu:t});
      document.getElementById('comment-gen-texte').value='';
      document.getElementById('editeur-comment-general').classList.add('hidden');
      chargerFil();
    });

    // ---------- init ----------
    chargerEntete();
    chargerFil();
  </script>
</body>
</html>
